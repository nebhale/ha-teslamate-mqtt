# Vendored from Home Assistant Core's mypy configuration.
# Source: https://github.com/home-assistant/core/blob/dev/mypy.ini

[mypy]
python_version = 3.14
platform = linux
show_error_codes = true
follow_imports = normal
namespace_packages = true
explicit_package_bases = true
local_partial_types = true
strict_equality = true
strict_bytes = true
no_implicit_optional = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
enable_error_code = deprecated, ignore-without-code, redundant-self, truthy-iterable
disable_error_code = annotation-unchecked, import-not-found, import-untyped
extra_checks = false
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
warn_return_any = true
warn_unreachable = true
files = custom_components, tests

[mypy-custom_components.*]
# Match Home Assistant Core's default component typing policy.
check_untyped_defs = false
disallow_incomplete_defs = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_untyped_defs = false
warn_return_any = false
warn_unreachable = false
no_implicit_reexport = false

[mypy-tests.*]
disable_error_code = union-attr
check_untyped_defs = false
disallow_incomplete_defs = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_untyped_defs = false
warn_return_any = false
warn_unreachable = false

[mypy-custom_components.teslamate_mqtt.config_flow]
# Needed when Home Assistant is not installed locally; with Home Assistant present,
# ConfigFlow's metaclass accepts the domain keyword.
disable_error_code = annotation-unchecked, import-not-found, import-untyped, call-arg
